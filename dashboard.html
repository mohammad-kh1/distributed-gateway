<!doctype html>
<html>
    <head>
        <title>Gateway Monitor</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                font-family: sans-serif;
                background: #1a1a1a;
                color: white;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .container {
                width: 80%;
                margin-top: 50px;
            }
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                margin-bottom: 30px;
            }
            .card {
                background: #2d2d2d;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                border-bottom: 4px solid #3498db;
            }
        </style>
    </head>
    <body>
        <h1>Gateway Real-time Monitor</h1>
        <div class="container">
            <div class="stats-grid">
                <div class="card">
                    <h3>Total</h3>
                    <h2 id="total">0</h2>
                </div>
                <div class="card" style="border-color: #2ecc71">
                    <h3>Success</h3>
                    <h2 id="success">0</h2>
                </div>
                <div class="card" style="border-color: #e74c3c">
                    <h3>401 Error</h3>
                    <h2 id="auth_err">0</h2>
                </div>
                <div class="card" style="border-color: #f1c40f">
                    <h3>Rate Limited</h3>
                    <h2 id="limited">0</h2>
                </div>
            </div>
            <canvas id="myChart"></canvas>
        </div>

        <script>
            const ctx = document.getElementById("myChart").getContext("2d");
            const chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "Throughput (Requests/sec)",
                            data: [],
                            borderColor: "#3498db",
                            tension: 0.1,
                        },
                    ],
                },
                options: { scales: { y: { beginAtZero: true } } },
            });

            const eventSource = new EventSource(
                "http://localhost:8080/admin/metrics/stream",
            );

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                document.getElementById("total").innerText =
                    data.total_requests;
                document.getElementById("success").innerText = data.accepted;
                document.getElementById("auth_err").innerText =
                    data.unauthorized;
                document.getElementById("limited").innerText =
                    data.rate_limited;

                const now = new Date().toLocaleTimeString();
                chart.data.labels.push(now);
                chart.data.datasets[0].data.push(data.total_requests);

                if (chart.data.labels.length > 20) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                }
                chart.update("none");
            };

            eventSource.onerror = (err) => {
                console.error("EventSource failed:", err);
                eventSource.close();
            };

            setInterval(updateStats, 2000);
        </script>
    </body>
</html>
